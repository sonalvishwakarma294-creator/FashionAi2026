services:
  - type: web
    name: fashion-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: USE_SQLITE
        value: "True"
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
